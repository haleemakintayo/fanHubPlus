<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="100%" height="100%">
  <defs>
    <style>
      .logo-text { font-family: 'Arial Black', 'Inter', system-ui, sans-serif; font-size: 48px; font-weight: 900; letter-spacing: 1px;}
      .heavy-border { stroke: #000000; stroke-width: 6; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- "FAN" Block (Black Box, White Text) -->
  <rect x="28" y="38" width="140" height="76" fill="#000000" rx="4" />
  <rect x="20" y="30" width="140" height="76" fill="#000000" rx="4" class="heavy-border" />
  <text x="42" y="85" class="logo-text" fill="#FFFFFF">FAN</text>

  <!-- "HUB" Block (Yellow Box, Black Text) -->
  <rect x="178" y="38" width="140" height="76" fill="#000000" rx="4" />
  <rect x="170" y="30" width="140" height="76" fill="#FACC15" rx="4" class="heavy-border" />
  <text x="190" y="85" class="logo-text" fill="#000000">HUB</text>

  <!-- "+" Block (Hot Pink Box, Chunky White Cross) -->
  <rect x="328" y="38" width="76" height="76" fill="#000000" rx="4" />
  <rect x="320" y="30" width="76" height="76" fill="#F43F5E" rx="4" class="heavy-border" />
  
  <!-- Chunky Geometric Plus Icon -->
  <path d="M 350 48 H 366 V 60 H 378 V 76 H 366 V 88 H 350 V 76 H 338 V 60 H 350 Z" fill="#FFFFFF" class="heavy-border" />
</svg>
