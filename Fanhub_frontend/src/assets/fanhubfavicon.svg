<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Neo-Brutalist Hard Drop Shadow -->
  <rect x="8" y="8" width="50" height="50" rx="8" fill="#000000" />

  <!-- Main Card Face (Cyber Yellow) -->
  <rect 
    x="4" 
    y="4" 
    width="50" 
    height="50" 
    rx="8" 
    fill="#FACC15" 
    stroke="#000000" 
    stroke-width="4" 
